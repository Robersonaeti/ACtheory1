:root{color-scheme:dark;--bg:#07101e;--pane:#101d30;--pane2:#14263a;--border:#294058;--text:#f4f7fc;--muted:#afc0d3;--teal:#45e0cd;--sky:#78baff;--orange:#ffbc79;--red:#eb8787;--green:#a0e5b1}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#162c43 0%,var(--bg) 54%);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text);line-height:1.5}button{font:inherit;cursor:pointer}button:focus-visible,[draggable]:focus-visible,.dropzone:focus-visible{outline:3px solid #ffe087;outline-offset:2px}.shell{max-width:1300px;margin:0 auto;padding:22px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}.brand{font-size:12px;letter-spacing:.19em;text-transform:uppercase;color:#9ddacd;font-weight:900}.brand b{color:white}.tag{font-size:12px;color:var(--muted);border:1px solid var(--border);border-radius:99px;padding:7px 11px}.controls{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid #3d566c;border-radius:12px;padding:12px 16px;background:#193049;color:white;font-weight:700}.btn.primary{background:var(--teal);border-color:var(--teal);color:#071521}.btn:hover{filter:brightness(1.12)}.btn:disabled{opacity:.4;cursor:not-allowed}.btn.lite{background:transparent}.hero{border:1px solid var(--border);background:linear-gradient(135deg,#132943,#091a2a);border-radius:24px;padding:clamp(24px,5vw,52px);margin-top:30px;max-width:1070px}.eyebrow{font-weight:900;color:var(--teal);font-size:12px;text-transform:uppercase;letter-spacing:.18em}.hero h1{font-size:clamp(36px,5vw,64px);line-height:1.08;letter-spacing:-.04em;margin:14px 0}.hero p{color:#c4d2e0;max-width:760px;font-size:17px}.hero .cta{margin-top:24px;display:flex;gap:12px;flex-wrap:wrap}.metrics{display:flex;flex-wrap:wrap;gap:14px;margin-top:26px}.metric{border:1px solid #32506c;border-radius:11px;padding:12px 16px;color:#b8d0e1}.metric strong{color:white;font-size:24px;display:block}.small{font-size:12px;color:var(--muted)}.progress{height:6px;background:#243c54;border-radius:10px;overflow:hidden;margin:8px 0 24px}.progress>div{height:100%;background:linear-gradient(90deg,#27c7bc,#9de7bd);transition:width .2s}.question-grid{display:grid;grid-template-columns:minmax(0,1.04fr) minmax(350px,.96fr);gap:18px;align-items:stretch}.panel{background:var(--pane);border:1px solid var(--border);border-radius:20px;padding:clamp(17px,2.8vw,28px);min-width:0}.heading{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;text-transform:uppercase;letter-spacing:.11em;color:#a4c7d7;font-weight:900}.question{font-weight:800;font-size:clamp(20px,2.3vw,29px);line-height:1.3;margin:22px 0 19px;letter-spacing:-.02em}.choose-intro{font-size:13px;color:#b3c9d8;margin:0 0 12px}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choice{min-height:72px;cursor:grab;display:flex;align-items:center;gap:10px;padding:15px;border:1px solid #35546b;border-radius:13px;background:#152a41;user-select:none;color:#f7faff;font-weight:750;transition:background .12s,transform .12s,border .12s}.choice .letter{flex:0 0 29px;height:29px;border:1px solid #4c687b;border-radius:8px;display:grid;place-items:center;color:#a7c1d1}.choice:hover{background:#1c3852;transform:translateY(-1px)}.choice.armed{border:2px solid #fcd48d;background:#4a3b29}.choice.placed{border-color:#68d2c1}.dropzone{min-height:115px;border:2px dashed #5b7d90;border-radius:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:5px;padding:16px;background:#0c2235;margin-top:18px;cursor:pointer}.dropzone.hover{background:#1e4653;border-color:var(--teal)}.dropzone.has-answer{border-style:solid;border-color:#e2ba7a;background:#2c2d2e}.dropzone strong{font-size:21px}.dropzone .small{color:#b4cddd}.quiet-notice{margin-top:14px;border-radius:9px;background:#122f3f;padding:10px 12px;border-left:3px solid #528dac;font-size:12px;color:#c3d4df}.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px;flex-wrap:wrap}.stage-header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;color:#b3d5df;text-transform:uppercase;font-size:12px;font-weight:900;letter-spacing:.12em}.stage{background:linear-gradient(180deg,#0a1728,#0c2033);border:1px solid #24465e;border-radius:16px;padding:16px;margin-top:15px;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden}.stage svg{max-width:100%;width:100%;height:auto}.stage .reading{font-family:Consolas,'Courier New',monospace;font-size:clamp(18px,2.2vw,27px);color:#fbd8a6;text-align:center;font-weight:800}.stage-sub{color:#a6becf;font-size:13px;text-align:center}.stage-title{color:#90e3d8;font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:900}.visualnote{background:#0b2133;border:1px solid #244b5e;border-radius:12px;padding:13px;color:#c0d3e1;font-size:12px;line-height:1.6;margin-top:14px}.diagram{background:#f8fafc;border:1px solid #c6d6df;border-radius:12px;padding:9px;width:100%;margin:12px auto;max-width:570px}.diagram svg{width:100%;height:auto;display:block}.shapes{stroke:#213d52;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dtext{font-size:14px;fill:#1b3044;font-weight:600}.bulb{--glow:.1;width:120px;height:120px;border:4px solid #f8c36a;background:rgba(255,217,116,var(--glow));border-radius:50%;box-shadow:0 0 calc(95px * var(--glow)) calc(10px * var(--glow)) rgba(255,210,74,var(--glow)),inset 0 0 35px rgba(255,240,148,var(--glow));transition:all .3s;position:relative}.bulb:before{content:'✦';position:absolute;top:39px;left:43px;font-size:35px;color:#ffeabb;opacity:calc(var(--glow) + .1)}.bulb:after{content:'';position:absolute;bottom:-26px;left:38px;width:39px;height:24px;background:linear-gradient(#778896,#243e54);border-radius:0 0 8px 8px}.motor-face{width:150px;height:150px;border-radius:50%;border:13px solid #5b89a5;background:radial-gradient(circle,#243b53 0 24%,#7698a8 25% 31%,#102334 32%);position:relative;box-shadow:0 0 0 10px #0d2938}.rotor{position:absolute;inset:12px;border-radius:50%;border:9px dashed #f1b874;animation:spin linear infinite}.rotor:after{content:'';position:absolute;top:50%;left:50%;width:15px;height:15px;border-radius:50%;background:#e2e8ed;transform:translate(-50%,-50%)}@keyframes spin{to{transform:rotate(360deg)}}@keyframes cap-pulse{0%,100%{opacity:.75}50%{opacity:1;filter:brightness(1.35)}}.cap-pulse{animation:cap-pulse 1.15s ease-in-out infinite}.flow-line{stroke-dasharray:12 9;animation:flow 1.4s linear infinite}@keyframes flow{to{stroke-dashoffset:-84}}.wave-sweep{animation:sweep 2.8s linear infinite;transform-origin:26px center}@keyframes sweep{from{transform:translateX(0)}to{transform:translateX(412px)}}.bar{width:100%;height:18px;background:#234359;border-radius:20px;overflow:hidden}.bar>div{height:100%;border-radius:20px;background:linear-gradient(90deg,#4ac2de,#efb96f);transition:width .3s}.barinfo{display:flex;justify-content:space-between;gap:12px;max-width:420px;width:100%;color:#becfe0;font-size:12px}.atom-ring{stroke:#527b91;fill:none;stroke-width:1.6}.atom-electron{fill:#e8c784}.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:12px;margin-top:20px}.review-row{border:1px solid var(--border);padding:17px;border-radius:14px;background:#102135}.review-row p{margin:5px 0}.good{color:#a1eac0}.bad{color:#ffb2a5}.review-answer{font-weight:700;color:#ffdbad}.review-explain{font-size:13px;color:#c3d5e1;line-height:1.55}.pill{display:inline-block;border-radius:99px;border:1px solid #557b7c;padding:4px 9px;font-size:11px}.status{color:var(--teal);font-size:12px;font-weight:800}.foot{font-size:12px;color:#92a6b9;margin:30px 0}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}@media(max-width:950px){.question-grid{grid-template-columns:1fr}.shell{padding:14px}.panel{padding:18px}.stage{min-height:240px}}@media(max-width:490px){.options{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.controls{width:100%}.btn{flex:1}.question{font-size:21px}.hero h1{font-size:37px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>

<script>
const DATA=[{"id":1,"topic":"Motor power","q":"A training drive is labeled 2 horsepower of shaft output. Which watt value represents that mechanical rating?","opts":["1,194 W","1,492 W","1,679 W","2,238 W"],"key":1,"kind":"motor","why":"One mechanical horsepower equals 746 W. Two horsepower corresponds to 2 × 746 = 1,492 W. Actual electrical input is higher when motor losses are included.","params":{"values":[1194,1492,1679,2238],"reference":1492,"unit":"W","rpm":1450},"notes":["The selected watt estimate is applied to a hypothetical variable-power training drive. Its rotor speed is illustrative; shaft horsepower alone does not establish a motor RPM."]},{"id":2,"topic":"Motor power","q":"A pump motor delivers 1.25 hp of mechanical output. Choose its equivalent output power in watts.","opts":["466.3 W","932.5 W","1,119 W","1,492 W"],"key":1,"kind":"motor","why":"1.25 × 746 = 932.5 mechanical watts. The motor may require more electrical input because efficiency is below 100%.","params":{"values":[466.3,932.5,1119,1492],"reference":932.5,"unit":"W","rpm":1350},"notes":["Imagine each estimate controls the available mechanical-power setting on a training rig."]},{"id":3,"topic":"Series and parallel","q":"In a _____ Circuit, Current is equal and Voltage is additive.  In a _____ Circuit, Voltage is equal and Current is additive.","opts":["Parallel / Series","Series / Parallel","Open / Short","DC / AC"],"key":1,"kind":"branches","why":"In series, current is common and voltage drops add. In parallel, voltage is common and branch currents add.","params":{"modes":["parallel","series","double-series","double-parallel"]},"notes":["Two arrangements are shown according to the answer chosen. Compare their circuit paths and branch connections."]},{"id":4,"topic":"Lamp load","q":"A resistive workshop lamp is rated 900 W at 120 V. What current should be written on its operating worksheet?","opts":["3.75 A","7.50 A","9.00 A","12.00 A"],"key":1,"kind":"lamp","why":"For a resistive load, I = P/V = 900/120 = 7.50 A.","params":{"values":[3.75,7.5,9,12],"reference":7.5,"voltage":120,"unit":"A","ratedW":900},"notes":["To visualize each option, the animation models a different hypothetical lamp power draw at fixed 120 V. Choosing an answer does not change a real lamp."]},{"id":5,"topic":"Atomic structure","q":"A technician compares materials by counting their outer-shell electrons. Which range is commonly associated with tightly bound valence electrons in insulating materials?","opts":["1–2","3–4","6–8","9–10"],"key":2,"kind":"atom","why":"In introductory electrical theory, insulators are commonly described as having 6–8 valence electrons tightly bound to their atoms. The real behavior of solids depends on electron band structure.","params":{"values":[2,4,8,10]},"notes":["The atomic sketch changes the displayed outer-shell population for the selection."]},{"id":6,"topic":"Voltage drop","q":"When planning a long lighting branch circuit, which single-branch voltage-drop percentage is commonly recommended in NEC informational guidance for efficient operation?","opts":["2%","3%","4%","6%"],"key":1,"kind":"lamp","why":"NEC informational guidance commonly recommends a maximum 3% voltage drop on an individual branch circuit and 5% combined feeder plus branch for reasonable efficiency; this is guidance, not a universal mandatory limit.","params":{"values":[2,3,4,6],"reference":3,"unit":"%","voltage":120,"mode":"drop"},"notes":["The lamp visualization shows the estimated delivered voltage for the percentage chosen. It does not mark compliance until review."]},{"id":7,"topic":"Motor circuit","q":"In the simplified motor circuit shown, an 18 V source has 0.10 Ω internal resistance and the motor is represented by 0.05 Ω. When the pushbutton is held closed, what power is dissipated in the motor resistance?","opts":["360 W","720 W","1,080 W","2,160 W"],"key":1,"kind":"motor-circuit","why":"R_total = 0.10 + 0.05 = 0.15 Ω. I = 18/0.15 = 120 A. P_motor = I²R_motor = 120² × 0.05 = 720 W. This is an idealized resistive model, not a realistic running motor model with back EMF.","params":{"values":[360,720,1080,2160],"reference":720,"voltage":18,"rb":0.1,"rm":0.05,"unit":"W"},"notes":["The pushbutton in the illustration can be pressed to close the simulated circuit. The chosen answer controls the training power gauge."]},{"id":8,"topic":"Voltage drop","q":"A 240 V source feeds a 3,600 W load through a 400 ft, one-way run of 10 AWG copper (10,380 circular mils). Using K = 12.6, estimate voltage at the load. Assume the load current is 3,600/240 A.","opts":["209.12 V","225.43 V","236.40 V","240.00 V"],"key":1,"kind":"lamp","why":"I = 3600/240 = 15 A. Voltage drop = (2 × 12.6 × 15 × 400)/10380 = 14.57 V. Load voltage ≈ 225.43 V. This uses the stated constant-current estimate; an actual resistive load would change current as voltage changes.","params":{"values":[209.12,225.43,236.4,240],"reference":225.43,"unit":"V","voltage":240,"mode":"delivered"},"notes":["The supply is fixed at 240 V in the illustration. Each selected number is treated as a predicted load terminal voltage."]},{"id":9,"topic":"Conductor sizing","q":"For a 120 V single-phase, 16 A branch over 175 ft one-way, copper K = 12.6, choose the smallest listed AWG conductor that meets a 3% voltage-drop design target (voltage drop only).","opts":["10 AWG","8 AWG","6 AWG","4 AWG"],"key":2,"kind":"wire","why":"Allowable drop = 120 × 0.03 = 3.6 V. CM required = 2KIL/VD = (2×12.6×16×175)/3.6 = 19,600 cmil. Of the listed sizes, 6 AWG (26,240 cmil) is the smallest that meets this drop target. Ampacity and other code requirements must also be checked.","params":{"values":[10380,16510,26240,41740],"reference":19600,"unit":"cmil","voltage":120,"current":16,"length":175},"notes":["Compare the cable cross-section and the hypothetical calculated drop as each size is selected."]},{"id":10,"topic":"Conductor dimensions","q":"A round conductor measures 0.094 inch in diameter. What is its cross-sectional area in circular mils?","opts":["9,400 cmil","8,836 cmil","94 cmil","18,836 cmil"],"key":1,"kind":"wire","why":"Convert diameter to mils: 0.094 × 1,000 = 94 mil. Circular mil area = d² = 94² = 8,836 cmil.","params":{"values":[9400,8836,94,18836],"reference":8836,"unit":"cmil"},"notes":["The training conductor illustration changes thickness according to the selected circular-mil area."]},{"id":11,"topic":"Conductor heating","q":"A wire has 12 A flowing and a known resistance of 0.40 Ω. Which expression directly gives its resistive power loss using those two known quantities?","opts":["P = I × R","P = I² × R","P = Vsource × I","P = I² / R"],"key":1,"kind":"heat","why":"The required relationship is P_loss = I²R. For 12 A and 0.40 Ω, the conductor dissipates 12² × 0.40 = 57.6 W.","params":{"values":[4.8,57.6,1440,360],"reference":57.6,"unit":"W","current":12,"resistance":0.4},"notes":["The heating indicator uses the result of the dropped expression. The third choice uses a separate 120 V source as a deliberately incorrect assumption."]},{"id":12,"topic":"Vectors","q":"A single Vector produced from combining two or more Vectors is called the _____ Vector.","opts":["Terminal","Resultant","Summer","Trajectory"],"key":1,"kind":"vector-term","why":"A resultant vector represents the combined effect of two or more vectors, including both magnitude and direction.","params":{"modes":["terminal","resultant","summer","trajectory"]},"notes":["The vector display sketches the kind of object named by the answer."]},{"id":13,"topic":"Impedance vectors","q":"A right-angle impedance triangle has 24 Ω of resistance and 32 Ω of inductive reactance. Which value is the magnitude of total impedance?","opts":["8 Ω","40 Ω","56 Ω","38 Ω"],"key":1,"kind":"vector","why":"Because R and X_L are 90 degrees apart in an RL circuit, |Z| = √(24² + 32²) = 40 Ω.","params":{"values":[8,40,56,38],"reference":40,"geom":{"shape":"triangle","x":24,"y":32},"unit":"Ω"},"notes":["The orange arrow shows the magnitude the student is proposing."]},{"id":14,"topic":"Opposing vectors","q":"Two voltage phasors share an axis but point in opposite directions. A measures 90 V rightward and B measures 35 V leftward. What is their net magnitude?","opts":["125 V","55 V","35 V","90 V"],"key":1,"kind":"vector","why":"Opposing collinear vectors subtract: 90 − 35 = 55 V. The resultant points in the direction of the larger 90 V vector.","params":{"values":[125,55,35,90],"reference":55,"geom":{"shape":"opposite","a":90,"b":35},"unit":"V"},"notes":["The model redraws an estimated net arrow corresponding to the dropped number."]},{"id":15,"topic":"Right-angle vectors","q":"A pair of perpendicular voltage vectors measures 48 V horizontally and 64 V vertically. Find the magnitude of their combined vector.","opts":["112 V","80 V","68 V","16 V"],"key":1,"kind":"vector","why":"The perpendicular components form a right triangle: √(48² + 64²) = √6400 = 80 V.","params":{"values":[112,80,68,16],"reference":80,"geom":{"shape":"triangle","x":48,"y":64},"unit":"V"},"notes":["A dashed resultant extends or contracts when a different choice is dropped."]},{"id":16,"topic":"Vector projection","q":"A 120-unit vector points 30° above the positive horizontal axis. Find the horizontal component, rounded to one decimal.","opts":["60.0","103.9","120.0","90.0"],"key":1,"kind":"vector","why":"Horizontal projection uses cosine: 120 cos(30°) ≈ 103.9 units.","params":{"values":[60,103.9,120,90],"reference":103.9,"geom":{"shape":"horizontal","mag":120,"angle":30},"unit":"units"},"notes":["The horizontal projection changes length with the answer placed in the box."]},{"id":17,"topic":"Vector projection","q":"A 140-unit vector rises at 30° above horizontal. What is its vertical component?","opts":["121.2","140.0","70.0","90.0"],"key":2,"kind":"vector","why":"The vertical component is the opposite side: 140 sin(30°) = 70 units.","params":{"values":[121.2,140,70,90],"reference":70,"geom":{"shape":"vertical","mag":140,"angle":30},"unit":"units"},"notes":["The vertical projection adjusts as the selection changes."]},{"id":18,"topic":"Vector angle","q":"A right triangle has a 24-unit horizontal leg, a 7-unit vertical leg, and a 25-unit hypotenuse. What angle does the hypotenuse make with the horizontal?","opts":["16.3°","25.0°","73.7°","29.2°"],"key":0,"kind":"vector","why":"θ = tan⁻¹(7/24) ≈ 16.26°, so 16.3° to one decimal place.","params":{"values":[16.3,25,73.7,29.2],"reference":16.26,"geom":{"shape":"angle","x":24,"y":7},"unit":"°"},"notes":["The protractor arrow rotates to the selected angle."]},{"id":19,"topic":"AC generation","q":"A DC waveform will cross the Horizontal (0°) axis, but an AC waveform will not.","opts":["True","False"],"key":1,"kind":"wave","why":"False. An AC waveform normally crosses the horizontal zero axis as its polarity alternates. A steady DC waveform stays on one side of the zero axis, so it does not cross during normal steady operation.","params":{"modes":["alternating","flat"]},"notes":["The blue AC waveform and red DC waveform illustrate the statement under the selected True/False assumption. Both are labeled, and the horizontal zero axis is shown. This display does not reveal correctness until the final review."]},{"id":20,"topic":"Generator construction","q":"AC generators utilize _____ to produce Alternating current electricity, and DC generators utilize _____ to produce Direct current Electricity.","opts":["Slip Rings / Commutators","Commutators / Slip Rings","Commutators / Commutators","Slip Rings / Slip Rings"],"key":0,"kind":"generator","why":"In the elementary generator models, continuous slip rings collect AC while a split-ring commutator mechanically rectifies the output of the DC generator.","params":{"modes":["slip","reverse","both-slip","both-split"]},"notes":["The rotating generator graphic switches collector styles based on the chosen pair."]},{"id":21,"topic":"AC generator RPM","q":"A 60 Hz generator has six poles. How many RPMs should it turn?","opts":["600 rpm","1,200 rpm","1,800 rpm","3,600 rpm"],"key":1,"kind":"motor","why":"Generator RPM is found from N = 120f/P. With 60 Hz and 6 poles, N = 120×60/6 = 1,200 rpm.","params":{"values":[600,1200,1800,3600],"reference":1200,"unit":"rpm","rpm":1200},"notes":["The generator rotor turns at the assumed RPM selection."]},{"id":22,"topic":"Resistive waveform","q":"Across an ideal resistance, a voltage sine wave and a current sine wave reach corresponding peaks at the same instant. Which phase relationship describes the pair?","opts":["Current leads by 90°","Current lags by 90°","They are in phase","They differ by 180°"],"key":2,"kind":"phase","why":"For a pure resistance, current and voltage are in phase with a 0° phase angle. Different amplitudes do not mean different phase angles.","params":{"shifts":[90,-90,0,180],"reference":0,"unit":"°"},"notes":["The selected phase shift is plotted as an orange current sine wave against a fixed blue voltage sine wave."]},{"id":23,"topic":"Instantaneous sine voltage","q":"An AC waveform has a peak voltage of 180 V. What is the voltage 25° into the cycle? Round to one decimal place.","opts":["38.0 V","76.1 V","163.1 V","180.0 V"],"key":1,"kind":"wavevalue","why":"v = V_peak sinθ = 180 sin(25°) ≈ 76.1 V.","params":{"values":[38,76.1,163.1,180],"reference":76.07,"peak":180,"angle":25,"unit":"V"},"notes":["The selected instantaneous voltage is displayed as a sample on a 180 V peak waveform."]},{"id":24,"topic":"RMS voltage","q":"A clean sine wave reaches approximately 170 V positive peak. What is its effective (RMS) value, rounded to one decimal?","opts":["120.2 V","170.0 V","240.4 V","85.0 V"],"key":0,"kind":"wavevalue","why":"For a sine-shaped AC waveform, V_RMS = V_peak/√2 = 170/√2 ≈ 120.2 V.","params":{"values":[120.2,170,240.4,85],"reference":120.21,"peak":170,"unit":"V"},"notes":["Compare the chosen meter setting to a drawn AC sine wave."]},{"id":25,"topic":"Rectified average","q":"A full-wave-rectified sine wave has an original RMS voltage of 120 V. What is its average rectified value, rounded to a whole volt?","opts":["76 V","108 V","120 V","170 V"],"key":1,"kind":"wavevalue","why":"V_avg,rectified = (2√2/π) × V_RMS ≈ 0.9003 × 120 ≈ 108 V.","params":{"values":[76,108,120,170],"reference":108.04,"peak":169.71,"unit":"V"},"notes":["The display overlays the hypothesized DC-average level on a rectified sine waveform."]},{"id":26,"topic":"AC voltage notation","q":"A data sheet specifies a nominal 208 V AC supply but does not label it peak or average. Which voltage convention is normally intended?","opts":["Peak","RMS (effective)","Rectified average","Peak-to-peak"],"key":1,"kind":"meter","why":"Unless specifically stated otherwise, ordinary AC equipment voltage ratings are normally expressed as RMS (effective) values.","params":{"modes":["peak","rms","average","p2p"]},"notes":["The simulated meter changes its measurement mode according to the selected term."]},{"id":27,"topic":"Magnetic fields","q":"A compass close to a current-carrying straight wire deflects when the circuit is energized. Which field around the conductor explains the deflection?","opts":["Electrostatic field","Magnetic field","Sound field","Temperature field"],"key":1,"kind":"field","why":"Electrical current establishes a magnetic field circulating around the conductor, which can deflect a nearby compass.","params":{"modes":["electrostatic","magnetic","sound","thermal"]},"notes":["The training scene displays the sort of field implied by the selection."]},{"id":28,"topic":"Electromagnetic induction","q":"The Three Important factors needed to Generate an Induced voltage are a conductor, a magnetic field, and _____.","opts":["Current","Poles","Relative Motion","Resistance"],"key":2,"kind":"generator","why":"The three factors listed in the original test are a conductor, a magnetic field, and relative motion. Relative motion between the conductor and magnetic field creates a change in magnetic flux linkage and const app=document.getElementById('app');
let state={screen:'home',order:[],cursor:0,answers:{},armed:null,hover:false,review:false,motorSwitch:true,session:0};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function start(){state={screen:'play',order:shuffle(DATA.map(q=>q.id)),cursor:0,answers:{},armed:null,hover:false,review:false,motorSwitch:true,session:state.session+1};render()}
function qnow(){return DATA.find(q=>q.id===state.order[state.cursor])}
function answeredCount(){return Object.keys(state.answers).length}
function pick(n){state.armed=n;render()}
function drop(n){const q=qnow();if(!q||n==null||n<0||n>=q.opts.length)return;state.answers[q.id]=n;state.armed=null;render()}
function next(){if(state.cursor<state.order.length-1){state.cursor++;state.armed=null;render()}else if(answeredCount()===DATA.length){state.screen='done';render()} }
function prev(){state.cursor=Math.max(0,state.cursor-1);state.armed=null;render()}
function jump(n){state.cursor=n;state.armed=null;state.screen='play';render()}
function reveal(){state.screen='review';state.review=true;render()}
function header(){return `<div class="top"><div><div class="brand">AC THEORY <b>·</b> PRACTICE LAB</div><div class="small">Electrical systems · corrected master · offline</div></div><div class="controls"><button class="btn lite" data-act="fullscreen">⛶ Projector view</button>${state.screen!=='home'?'<button class="btn lite" data-act="restart">↻ New random order</button>':''}</div></div>`}
function home(){return `${header()}<section class="hero"><div class="eyebrow">Student simulation · rewritten exam practice</div><h1>Make a choice.<br/>See what happens.</h1><p>Drag an answer into the equipment box and watch the motor, lamp, circuit, vector, or waveform react. There is <b>no instant answer reveal</b>. Explanations are held until the review after all 40 questions.</p><div class="cta"><button class="btn primary" data-act="start">Start randomized lab →</button></div><div class="metrics"><div class="metric"><strong>40</strong>reworded practice questions</div><div class="metric"><strong>13</strong>redrawn circuit/vector diagrams</div><div class="metric"><strong>158</strong>answer-driven outcomes</div></div><p class="small">The question order changes every time you start a new session. You can drag with a mouse, or tap a choice and then tap the answer box. No personal data is stored or sent.</p></section>`}
function play(){const q=qnow(),chosen=state.answers[q.id],has=chosen!==undefined,pct=answeredCount()/DATA.length*100;return `${header()}<div class="heading"><span>Practice ${state.cursor+1} of ${DATA.length} · ${esc(q.topic)}</span><span>${answeredCount()} of 40 answers placed</span></div><div class="progress"><div style="width:${pct}%"></div></div><div class="question-grid"><section class="panel"><div class="heading"><span>Drag & drop challenge</span><span>Unscored until review</span></div><div class="question">${esc(q.q)}</div><p class="choose-intro">Drag your choice into the response box. On touch devices, tap a choice, then tap the box.</p><div class="options">${q.opts.map((a,i)=>`<div class="choice ${state.armed===i?'armed':''} ${chosen===i?'placed':''}" role="button" tabindex="0" draggable="true" data-pick="${i}" aria-label="Choose ${esc(a)}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(a)}</span></div>`).join('')}</div><div class="dropzone ${has?'has-answer':''}" role="button" tabindex="0" aria-label="Answer drop box; tap after choosing an option" id="dropzone"><div class="stage-title">Response bay · drop your answer here</div>${has?`<strong>${esc(q.opts[chosen])}</strong><span class="small">Model loaded. No verdict yet. Drop another choice to test a different outcome.</span>`:`<strong>${state.armed!==null?'Tap here to load your selected answer':'Drop answer here'}</strong><span class="small">The simulation updates after you make a selection.</span>`}</div><div class="quiet-notice">The equipment responds to the <b>selected assumption</b>, not to a graded answer. Watch what changes; decide what the numbers mean. Full solutions stay hidden until the end.</div><div class="nav"><button class="btn" data-act="back" ${state.cursor===0?'disabled':''}>← Previous</button><span class="status">${has?'Response recorded for this question':'Select an answer to continue'}</span><button class="btn primary" data-act="next" ${!has?'disabled':''}>${state.cursor===39?'Finish practice':'Next question →'}</button></div></section><section class="panel"><div class="stage-header"><span>Interactive equipment bay</span><span>${has?'Simulation active':'Ready'}</span></div>${diagram(q)}${simulation(q,has?chosen:null)}<div class="visualnote">${esc(q.notes[0]||'Training visualization responds to the selected assumption.')}</div></section></div>`}
function done(){return `${header()}<section class="hero"><div class="eyebrow">All 40 practice selections recorded</div><h1>Simulation complete.</h1><p>You finished the activity without answer-by-answer grading. Your choices have been saved in this browser session only. Open the review to compare your choices with the new practice-question solutions.</p><div class="cta"><button class="btn primary" data-act="reveal">Reveal full review & explanations</button><button class="btn" data-act="restart">Run a new random order</button></div><p class="small">No question-answer verdicts appeared during the simulation. The review is optional and appears only now.</p></section>`}
function review(){const scored=state.order.filter(id=>state.answers[id]===DATA[id-1].key).length;return `${header()}<section class="hero" style="margin-top:12px"><div class="eyebrow">Instructor & student review · post-activity only</div><h1>${scored} / ${DATA.length}</h1><p>Below are the practice solutions. Each calculation and concept has been changed from the original test, and the list is kept in your session's randomized order.</p><div class="cta"><button class="btn primary" data-act="restart">New shuffled practice</button></div></section><div class="card-grid">${state.order.map((id,i)=>{const q=DATA[id-1],answer=state.answers[id],ok=answer===q.key;return `<article class="review-row"><div class="small">Practice ${i+1} · ${esc(q.topic)} · <span class="${ok?'good':'bad'}">${ok?'Match':'Review this one'}</span></div><h3 style="font-size:15px;line-height:1.4">${esc(q.q)}</h3><p>Your selection: <b>${esc(q.opts[answer])}</b></p><p class="review-answer">Worked answer: ${esc(q.opts[q.key])}</p><div class="review-explain">${esc(q.why)}</div></article>`}).join('')}</div>`}

    22:['A pure resistive heater draws current that rises and falls with supply voltage.','In a pure resistance, current and voltage peaks line up. Phase angle is about timing, not amplitude.'],

    24:['A 120 V household AC supply is normally described by effective (RMS) voltage.','For a sine wave, Vrms = Vpeak / square root of 2. Divide the given peak by about 1.414.'],
    25:['A full-wave bridge rectifier flips the negative half-cycle upward.','For a full-wave-rectified sine wave, average voltage = about 0.9003 x original RMS voltage.'],
    26:['An AC motor nameplate lists an ordinary supply voltage.','Unless labeled peak or average, standard AC equipment voltage ratings refer to the effective value.'],
    27:['A compass needle changes direction near an energized cable.','Current flowing in a wire makes a magnetic field surrounding the conductor.'],
    28:['Move a conductor through a generator magnetic field and a voltage appears.','Think of the generator as requiring a conductor, a magnetic field, and a change in their relative position.'],
    29:['A relay coil resists sudden current changes when switched.','An inductor follows v = L x (change in current / change in time). Identify the changing quantity.'],
    30:['A capacitor charges and discharges each AC cycle.','ICE: in a capacitor, current leads voltage. The ideal separation is one quarter cycle.'],
    31:['Three isolated choke coils are wired end-to-end.','For uncoupled series inductors, Ltotal = L1 + L2 + L3. Add the henry values.'],
    32:['Two separate inductors feed parallel branches of an AC control circuit.','Start with Leq = L1 x L2 / (L1 + L2). Then XL = 2 pi f Leq.'],
    33:['A small control coil is supplied by a 250 Hz source.','Convert mH to H; find XL = 2 pi f L; then Irms = Vrms / XL. Convert amps to milliamps.'],
    34:['A motor-run capacitor has two metal plates separated by a non-conductive layer.','The separator is an insulating material; it supports an electric field, not direct metal-to-metal contact.'],
    35:['A capacitor bank connected to AC takes current before voltage reaches its maximum.','Remember ICE: capacitive current leads voltage by a quarter cycle (90 degrees).'],
    36:['A capacitor connected to alternating polarity must have a suitable rating.','A conventional polarized electrolytic requires the correct DC bias; a nonpolarized type can handle alternating polarity when appropriately rated.'],
    37:['A power-factor circuit has one capacitor, a parallel pair, then another capacitor in series.','Combine the parallel pair by addition. For the resulting three series groups, add reciprocals of capacitances; then Xc = 1 / (2 pi f Ceq).'],
    38:['Three series capacitors carry the same current through the chain.','Find Ceq using 1/Ceq = 1/C1 + 1/C2 + 1/C3. Then I = 2 pi f Ceq V. Convert amps to mA.'],
    39:['A three-branch capacitor bank has one equivalent capacitance.','Parallel capacitances add. Then Xc = 1 / (2 pi f Ctotal), using farads rather than microfarads.'],
    40:['Three capacitor branches share the same 120 V AC bus.','For each capacitor, I = 2 pi f C V. With the same voltage and frequency, compare capacitance values directly.']
  };

  // This is supplemental context. It never labels a selection correct until the review screen.
  function scenario(q, selected) {
    const v = q.params?.values?.[selected], label = esc(q.opts[selected]);
    let body = '';
    switch (q.id) {
      case 1: case 2: {
        const rating = q.id===1 ? '2 hp conveyor drive' : '1.25 hp water pump';
        body = `<div class="lab-device"><div class="motor-face"><div class="rotor" style="animation-duration:2s"></div></div><div><strong>${rating}</strong><p>Selected mechanical output: <b>${label}</b>. A larger output could move more load under otherwise similar conditions. Motor speed cannot be determined from horsepower alone, and electrical input depends on efficiency.</p></div></div>`; break;
      }
      case 4: {
        const assumed = Number(v) || 0;
        const power = assumed * 120;
        body = `<div class="lab-device"><div class="lab-bulb" style="--light:${Math.min(1, Math.max(.08,power/1500)).toFixed(2)}">&#9732;</div><div><strong>120 V workshop lamp model</strong><p>Assuming ${label} at 120 V would imply <b>${power.toFixed(0)} W</b> of lamp power. Compare that result with the 900 W nameplate. This lamp animation compares hypothetical loads; the real nameplate rating is fixed.</p></div></div>`; break;
      }
      case 6: {
        const drop = Number(v) || 0, volts = 120 * (1-drop/100);
        body = `<div class="lab-device"><div class="lab-bulb" style="--light:${Math.pow(volts/120,2).toFixed(2)}">&#9732;</div><div><strong>Long branch-circuit lighting</strong><p>An illustrative ${drop}% drop on 120 V leaves ${volts.toFixed(1)} V at the lamp. A fixed-resistance lamp would deliver about ${(100*Math.pow(volts/120,2)).toFixed(0)}% of its nominal power. Actual LEDs can behave differently.</p></div></div>`; break;
      }
      case 8: {
        const vv = Number(v)||0;
        body = `<div class="lab-device"><div class="lab-bulb" style="--light:${Math.min(1,Math.pow(vv/240,2)).toFixed(2)}">&#9732;</div><div><strong>Distant 240 V resistive heater</strong><p>Your predicted load voltage is ${label}. With a fixed resistance, the modeled heat power would be ${(100*Math.pow(vv/240,2)).toFixed(0)}% of the 240 V nominal value. This is a comparison, not a constant-current re-solve.</p></div></div>`; break;
      }
      case 9: {
        const cmil = Number(v)||1, vd=2*12.6*16*175/cmil;
        body = `<strong>Remote workshop feeder</strong><p>For selected ${label}, the predicted drop is <b>${vd.toFixed(2)} V</b>; estimated load voltage is <b>${(120-vd).toFixed(2)} V</b>. The wire cross-section grows as circular mils grow. This check covers voltage drop only, not ampacity.</p>`; break;
      }
      case 11: {
        const z=12*12*.4;
        body = `<strong>Warming extension cord</strong><p>Measured current is 12 A and wire resistance is 0.40 ohm. The modeled conductor releases <b>${z.toFixed(1)} W</b> as heat. The heating formula determines whether the selected expression makes physical sense.</p>`; break;
      }
      case 20: case 28: {
        const moves = q.id===28 ? q.params.modes?.[selected]==='motion' : true;
        body = `<div class="lab-device"><div class="motor-face"><div class="rotor" style="animation-duration:2s;animation-play-state:${moves?'running':'paused'}"></div></div><div><strong>Rotating generator</strong><p>${q.id===28?'Relative motion between a magnetic field and conductor changes magnetic flux linkage. A stationary relative arrangement produces no induced voltage.':'A spinning coil produces alternating induced voltage. Slip rings and a split-ring commutator collect it differently.'}</p><p>Selected assumption: ${label}</p></div></div>`; break;
      }
      case 21: {
        const rpm=Number(v)||0,hz=rpm*6/120;
        body = `<div class="lab-device"><div class="motor-face"><div class="rotor" style="animation-duration:${Math.min(5,Math.max(.3,2*1200/Math.max(1,rpm))).toFixed(2)}s"></div></div><div><strong>Six-pole alternator</strong><p>At your proposed <b>${label}</b>, generator frequency would be <b>${hz.toFixed(1)} Hz</b>. A utility generator must maintain the appropriate mechanical speed for a 60 Hz output.</p></div></div>`; break;
      }
      case 24: {
        const peak=170, rms=peak/Math.sqrt(2);
        body = `<strong>Household AC voltage</strong><p>On a resistive heater, RMS voltage represents the effective heating-equivalent value. A 170 V peak is not 170 V RMS. Use the peak-to-RMS relationship to evaluate ${label}; the target RMS can be derived without guessing.</p>`; break;
      }
      case 27: case 29: case 30: case 35: {
        body = `<strong>${q.id===27?'Compass beside an energized cable':q.id===29?'Relay coil switching': 'AC capacitor charging'}</strong><p>${q.id===27?'Current in the conductor creates a surrounding magnetic field that can deflect a compass.':q.id===29?'Stored magnetic energy makes the coil oppose a rapid change in current.':'A capacitor charges and releases energy as voltage changes; the current waveform is shifted relative to voltage.'}</p><p>Your proposed relationship: ${label}</p>`; break;
      }
      case 40: {
        const caps=[3,7,5];
        body = `<strong>Three-branch capacitor bank</strong><div class="lab-cap-row">${caps.map((c,j)=>`<div class="lab-cap ${j===selected?'active':''}"><b>C${j+1}</b><span>${c} microfarads</span><i style="height:${c*8}px"></i></div>`).join('')}</div><p>All branches have the same voltage and frequency. The current each branch draws increases with its capacitance. Highlighted: ${label}.</p>`; break;
      }
      default: {
        const intro = guide[q.id][0];
        body = `<strong>${esc(intro)}</strong><p>${esc(concept(q))}</p><p class="lab-assumption">Your selected assumption: <b>${label}</b></p>`;
      }
    }
    return `<div class="lab-world"><div class="stage-title">Real-world connection</div>${body}</div>`;
  }
  function concept(q){
    const concepts={
      3:'A series light string has one current path; independently switched room lights use parallel branches. Compare what stays the same in each arrangement.',
      5:'Copper wires are selected for mobile electrons; wire insulation keeps charge from readily moving through the jacket.',
      7:'A starter circuit has source and load resistance. The model computes heating in the motor resistance; it is not a full running motor model.',
      10:'Copper wire thickness sets cross-sectional area, which influences resistance and voltage drop.',
      12:'Two directional forces combine into one resultant, like two electrical phasors.',
      13:'The winding resistance and reactance have perpendicular phasor components; use a right triangle to determine impedance magnitude.',
      14:'Like a tug-of-war, opposite vectors cancel part of each other, leaving a direction and a net size.',
      15:'Think of walking east and north: the straight-line resultant is not the simple sum of both distances.',
      16:'The horizontal projection of a sloped force or vector depends on cosine of its angle.',
      17:'A crane cable has both horizontal and vertical components; the vertical lifting share depends on sine.',
      18:'An inclined conveyor has rise and run; the angle is found by inverse tangent.',
      19:'An alternator crosses zero as it reverses polarity; a steady battery output does not alternate.',
      22:'An ideal electric heater has no phase shift between AC current and voltage.',
      23:'As the generator rotates, instantaneous voltage changes with the sine of the electrical angle.',
      25:'A full-wave rectifier redirects both half-cycles in the same direction, creating pulsating DC.',
      26:'A standard 208 V AC nameplate refers to the RMS supply, which predicts equivalent resistive heating.',
      31:'Uncoupled series chokes add their inductance, just as series resistors add resistance.',
      32:'Parallel choke coils lower equivalent inductance; frequency then sets their reactance.',
      33:'At higher frequency, a fixed coil has more inductive reactance and draws less idealized RMS current.',
      34:'The dielectric separates capacitor plates and stores energy in the electric field.',
      36:'Select a properly rated nonpolarized capacitor where voltage polarity alternates.',
      37:'A mixed capacitor network must be simplified branch by branch before finding reactance.',
      38:'A series capacitor string has the same branch current at every capacitor, even though voltage splits.',
      39:'Capacitor branches in parallel contribute additively to total capacitance.'
    };return concepts[q.id]||'Compare the physical model with the relationship in the question before selecting an answer.';
  }

  let usage = {};
  const originalStart = start, originalPlay = play, originalSimulation = simulation, originalDone=done, originalReview=review;
  start = function(){usage={}; originalStart();};
  play = function(){
    const q=qnow(), used=!!usage[q.id];
    let html=originalPlay();
    const hintArea=`<div class="lab-hintbox"><button type="button" class="btn lab-hintbtn" data-lab-hint="1" aria-expanded="${used}">${used?'Hint used (50% maximum)':'Hint - show a formula or partial example (50% maximum)'}</button>${used?`<div class="lab-hinttext"><strong>Hint:</strong> ${esc(guide[q.id][1])}<p>Since you opened the hint, this question is now worth up to 0.5 points, even if you change your answer later.</p></div>`:''}</div>`;
    html=html.replace('<div class="quiet-notice">',hintArea+'<div class="quiet-notice">');
    html=html.replace('<span>Unscored until review</span>',`<span>${used?'Hint used: max 0.5 point':'Full credit available: 1 point'}</span>`);
    return html;
  };
  simulation = function(q,idx){const base=originalSimulation(q,idx);if(idx===null)return base;return base+scenario(q,idx);};
  done = function(){const used=Object.keys(usage).filter(id=>usage[id]).length;let html=originalDone();return html.replace('Open the review',`${used} of 40 questions used a hint (maximum 0.5 point on those questions). Open the review`);};
  review = function(){
    let html=originalReview();
    const earned=state.order.reduce((sum,id)=>sum+(state.answers[id]===DATA[id-1].key?(usage[id]?0.5:1):0),0);
    const full=state.order.filter(id=>state.answers[id]===DATA[id-1].key&&!usage[id]).length;
    const partial=state.order.filter(id=>state.answers[id]===DATA[id-1].key&&usage[id]).length;
    html=html.replace(/<h1>\d+ \/ \d+<\/h1>/,`<h1>${earned.toFixed(1)} / ${DATA.length} points</h1><p>${full} full-credit correct + ${partial} hint-assisted correct at half credit. Incorrect answers receive 0.</p>`);
    let k=0;
    html=html.replace(/<article class="review-row">/g,()=>{
      const id=state.order[k++],used=!!usage[id],correct=state.answers[id]===DATA[id-1].key;
      return `<article class="review-row"><p class="small">${correct?(used?'Correct with hint: 0.5 point':'Correct without hint: 1 point'):'Incorrect: 0 points'}${used?' | Hint used':''}</p>`;
    });
    return html;
  };
  app.addEventListener('click',ev=>{
    if(!ev.target.closest('[data-lab-hint]'))return;
    const id=qnow()?.id;
    if(!id || state.screen!=='play')return;
    usage[id]=true;
    render();
  });
  const style=document.createElement('style');
  style.textContent=`
  .lab-hintbox{margin-top:15px;padding:12px;border:1px solid #527a93;border-radius:12px;background:#0d293d}
  .lab-hintbtn{width:100%;background:#365c78;text-align:left;white-space:normal}
  .lab-hinttext{font-size:15px;line-height:1.65;margin-top:12px;color:#e3eff5}
  .lab-hinttext p{color:#f0d39c;font-size:13px;margin-bottom:0}
  .lab-world{width:100%;margin-top:12px;padding:16px;border:1px solid #41677b;border-radius:14px;background:#0d2b3e;font-size:15px;color:#d7e7f0}
  .lab-world p{margin:8px 0;line-height:1.6}.lab-world strong{color:#e8f6fb}.lab-assumption{color:#aacbe1}
  .lab-device{display:flex;align-items:center;gap:26px;justify-content:center;flex-wrap:wrap}
  .lab-device>div:last-child{flex:1;min-width:190px}.lab-bulb{--light:.5;width:100px;height:100px;display:grid;place-items:center;border:4px solid #b28f55;border-radius:50%;background:rgba(255,225,100,var(--light));color:#513b1d;font-size:52px;box-shadow:0 0 calc(60px * var(--light)) rgba(255,225,120,var(--light))}
  .lab-cap-row{display:flex;gap:12px;margin-top:12px}.lab-cap{padding:10px;display:flex;flex:1;align-items:center;gap:8px;flex-direction:column;border:1px solid #547189;border-radius:9px}.lab-cap.active{background:#355b71;border-color:#ffd48c}.lab-cap span{font-size:11px}.lab-cap i{width:14px;max-height:64px;background:#e2bd81;border-radius:7px}
  `;
  document.head.appendChild(style);
})();

</script></body></html>
